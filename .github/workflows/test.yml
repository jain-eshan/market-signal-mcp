name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run contract tests (cassette replay only - no live network)
        run: uv run pytest tests/ -v --record-mode=none --ignore=tests/eval
      - name: Run structural report-format checks (no LLM/API key needed)
        run: uv run pytest tests/eval/test_report_structure.py -v
      # tests/eval/run_tool_selection.py and run_report_quality_judge.py drive
      # a real Claude Code session via `claude -p` (no separate API key, but
      # it does need an authenticated `claude` CLI, which a CI runner doesn't
      # have) - run those manually from a machine with `claude` logged in:
      #   uv run python tests/eval/run_tool_selection.py
      #   uv run python tests/eval/run_report_quality_judge.py
      # Keeping them out of the always-green CI job by design; they're named
      # run_*.py rather than test_*.py so pytest never tries to collect them.
