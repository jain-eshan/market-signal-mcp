[project]
name = "market-signal-mcp"
version = "0.1.0"
description = "Multi-source market-signal MCP server for case-comp and startup-idea research"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "pytrends",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mcpevals>=0.1.10",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-recording>=0.13.4",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests/eval"]
